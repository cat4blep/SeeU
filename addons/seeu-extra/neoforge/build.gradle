plugins {
    id "java-library"
    id "maven-publish"
    id "net.neoforged.moddev" version "2.0.141"
}

version = project.seeu_extra_version

base {
    archivesName = "seeu-extra-neoforge"
}

sourceSets.main.java.srcDir(project(":seeu-extra-common").file("src/client/java"))
sourceSets.main.java.srcDir(project(":seeu-extra-common").file("src/server/java"))

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version as int)
    }

    withSourcesJar()
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument "--nogui"
        }

        configureEach {
            systemProperty "neoforge.enabledGameTestNamespaces", "seeu_extra"
        }
    }

    mods {
        "seeu_extra" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = project.java_version as int
}

tasks.named("jar") {
    from(project(":seeu-extra-common").sourceSets.main.output)
}

tasks.named("sourcesJar") {
    from(project(":seeu-extra-common").sourceSets.main.allSource)
}

dependencies {
    implementation project(":common")
    implementation project(":seeu-extra-common")
    compileOnly "io.netty:netty-buffer:${project.netty_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            loader_version_range   : project.loader_version_range,
            neo_version            : project.neo_version,
            neo_version_range      : project.neo_version_range,
            mod_id                 : "seeu_extra",
            mod_name               : "SeeU Extra",
            mod_license            : "MIT",
            mod_version            : project.seeu_extra_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}
