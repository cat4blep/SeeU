modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/cat4blep/SeeU/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/cat4blep/SeeU"
iconFile="assets/seeu/icon.png"
authors="Keryesh4ka"
description='''
SeeU renders players beyond the vanilla entity-tracking range.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[modproperties.${mod_id}]
"sodium:config_api_user" = "dev.keryeshka.voxyseeu.neoforge.client.SeeUSodiumConfig"
