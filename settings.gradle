pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = "https://maven.neoforged.net/releases" }
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://repo.papermc.io/repository/maven-public/" }
        mavenCentral()
    }
}

plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

rootProject.name = "SeeU-1.21.1"

include("common")
include("fabric")
include("neoforge")
include("paper")

include("seeu-extra-common")
project(":seeu-extra-common").projectDir = file("addons/seeu-extra/common")

include("seeu-extra-fabric")
project(":seeu-extra-fabric").projectDir = file("addons/seeu-extra/fabric")

include("seeu-extra-neoforge")
project(":seeu-extra-neoforge").projectDir = file("addons/seeu-extra/neoforge")
